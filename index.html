<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editor tipo Word</title>
  <style>
    body {
      background: #ddd;
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .toolbar {
      background: #333;
      color: white;
      padding: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .toolbar button, .toolbar select, .toolbar input {
      cursor: pointer;
      padding: 5px 10px;
    }
    #editor {
      background: white;
      width: 21.59cm;
      height: 27.94cm;
      margin: 20px auto;
      padding: 2cm;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      overflow: auto;
    }
    table {
      border-collapse: collapse;
    }
    td {
      border: 1px solid #000;
      padding: 5px;
    }
    img {
      max-width: 100%;
      display: block;
      margin: 10px 0;
    }
  </style>
</head>
<body>

<div class="toolbar">
  <button onclick="exec('bold')">Negrita</button>
  <button onclick="exec('italic')">Cursiva</button>
  <button onclick="exec('underline')">Subrayado</button>

  <select onchange="setFontSize(this.value)">
    <option value="">Tamaño</option>
    <option value="10px">10</option>
    <option value="12px">12</option>
    <option value="14px">14</option>
    <option value="16px">16</option>
    <option value="18px">18</option>
    <option value="24px">24</option>
    <option value="32px">32</option>
  </select>

  <button onclick="exec('justifyLeft')">Izquierda</button>
  <button onclick="exec('justifyCenter')">Centrado</button>
  <button onclick="exec('justifyRight')">Derecha</button>
  <button onclick="exec('justifyFull')">Justificado</button>

  <button onclick="insertImage()">Imagen</button>
  <button onclick="insertTable()">Tabla</button>
  <button onclick="undo()">Deshacer</button>
  <button onclick="exportPDF()">PDF</button>
  <button onclick="exportWord()">Word</button>
  <input type="file" id="imgInput" accept="image/*" style="display:none">
</div>

<div id="editor" contenteditable="true"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>
  const editor = document.getElementById("editor");
  const imgInput = document.getElementById("imgInput");

  function exec(cmd) {
    document.execCommand(cmd, false, null);
  }

  function setFontSize(size) {
    document.execCommand("fontSize", false, "7");
    document.querySelectorAll("font[size='7']").forEach(font => {
      font.removeAttribute("size");
      font.style.fontSize = size;
    });
  }

  function undo() {
    document.execCommand("undo", false, null);
  }

  function insertImage() {
    imgInput.click();
  }

  imgInput.onchange = () => {
    const file = imgInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = document.createElement("img");
      img.src = e.target.result;
      img.setAttribute("contenteditable", "false");
      editor.appendChild(img);
    };
    reader.readAsDataURL(file);
  };

  function insertTable() {
    const rows = parseInt(prompt("Filas:", 2));
    const cols = parseInt(prompt("Columnas:", 2));
    if (!rows || !cols) return;

    const table = document.createElement("table");
    for (let i = 0; i < rows; i++) {
      const tr = document.createElement("tr");
      for (let j = 0; j < cols; j++) {
        const td = document.createElement("td");
        td.contentEditable = true;
        td.textContent = "Celda";
        tr.appendChild(td);
      }
      table.appendChild(tr);
    }
    editor.appendChild(table);
  }

  function exportPDF() {
    html2pdf().set({ margin: 0, filename: 'documento.pdf' }).from(editor).save();
  }

  function exportWord() {
    const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' " +
                   "xmlns:w='urn:schemas-microsoft-com:office:word' " +
                   "xmlns='http://www.w3.org/TR/REC-html40'>" +
                   "<head><meta charset='utf-8'></head><body>";
    const footer = "</body></html>";
    const sourceHTML = header + editor.innerHTML + footer;
    const source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
    const fileDownload = document.createElement("a");
    fileDownload.href = source;
    fileDownload.download = 'documento.doc';
    fileDownload.click();
  }
</script>

</body>
</html>
