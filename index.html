<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Editor de Texto en Línea</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f5f5f5;
    }

    .editor-container {
      width: 80%;
      max-width: 1000px;
      background-color: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 400px;
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 10px;
      font-size: 16px;
      resize: none;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 5px;
    }

    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="editor-container">
    <textarea id="editor" placeholder="Escribe aquí tu documento..."></textarea>
    <button id="downloadBtn">Descargar como PDF</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    let timeout;
    const editor = document.getElementById('editor');

    function autoSave() {
      localStorage.setItem('document', editor.value);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const savedDocument = localStorage.getItem('document');
      if (savedDocument) {
        editor.value = savedDocument;
      }
    });

    editor.addEventListener('input', () => {
      clearTimeout(timeout);
      timeout = setTimeout(autoSave, 5000);
    });

    document.getElementById('downloadBtn').addEventListener('click', async () => {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const lines = editor.value.split('\n');
      let y = 10;

      lines.forEach(line => {
        doc.text(line, 10, y);
        y += 10;
      });

      doc.save('documento.pdf');
    });
  </script>
</body>
</html>
