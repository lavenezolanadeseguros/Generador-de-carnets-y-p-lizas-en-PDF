<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Seguro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }
        .section {
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

    <h1>Formulario de Seguro</h1>

    <div class="section">
        <h2>DATOS DEL TOMADOR Y ASEGURADO</h2>
        <label for="tomador">Tomador:</label>
        <input type="text" id="tomador" name="tomador" oninput="copyTomadorToAsegurado()">

        <label for="asegurado">Asegurado:</label>
        <input type="text" id="asegurado" name="asegurado" readonly>

        <label for="direccion">Dirección:</label>
        <input type="text" id="direccion" name="direccion">

        <label for="ci_rif">C.I / RIF:</label>
        <input type="text" id="ci_rif" name="ci_rif">

        <label for="telefono">Teléfono:</label>
        <input type="text" id="telefono" name="telefono">
    </div>

    <div class="section">
        <h2>DATOS DE POLIZA</h2>
        <label for="vigencia_desde">Vigencia Desde:</label>
        <input type="text" id="vigencia_desde" name="vigencia_desde" readonly>

        <label for="vigencia_hasta">Hasta:</label>
        <input type="text" id="vigencia_hasta" name="vigencia_hasta" readonly>
    </div>

    <div class="section">
        <h2>DATOS DEL VEHICULO</h2>
        <label for="marca">Marca:</label>
        <input type="text" id="marca" name="marca">

        <label for="modelo">Modelo:</label>
        <input type="text" id="modelo" name="modelo">

        <label for="numero_pasajeros">Número de Pasajeros:</label>
        <input type="number" id="numero_pasajeros" name="numero_pasajeros">

        <label for="version">Versión:</label>
        <input type="text" id="version" name="version">

        <label for="ano">Año:</label>
        <input type="number" id="ano" name="ano">

        <label for="tipo_vehiculo">Tipo de Vehículo:</label>
        <input type="text" id="tipo_vehiculo" name="tipo_vehiculo">

        <label for="placa">Placa:</label>
        <input type="text" id="placa" name="placa">

        <label for="serial_motor">Serial del Motor:</label>
        <input type="text" id="serial_motor" name="serial_motor">

        <label for="uso">Uso:</label>
        <input type="text" id="uso" name="uso">

        <label for="color">Color:</label>
        <input type="text" id="color" name="color">

        <label for="serial_carroceria">Serial Carrocería:</label>
        <input type="text" id="serial_carroceria" name="serial_carroceria">
    </div>

            document.getElementById('asegurado').value = tomador;
