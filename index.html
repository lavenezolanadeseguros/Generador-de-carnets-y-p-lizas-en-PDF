<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editor de Seguro Preciso</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 40px;
      padding: 20px;
    }
    .form-section {
      background: #f9f9f9;
      padding: 20px;
      border-bottom: 1px solid #ccc;
    }
    .form-section input {
      width: 100%;
      padding: 5px;
      margin: 5px 0;
    }
    .doc-section {
      position: relative;
      width: 794px;
      height: 1123px;
      margin: auto;
      background-image: url('data:image/png;base64,AQUI_VA_LA_IMAGEN_EN_BASE64');
      background-size: cover;
    }
    .field {
      position: absolute;
      font-size: 11px;
      background-color: rgba(255,255,255,0.6);
      padding: 1px 3px;
      border-radius: 3px;
    }
    #downloadBtn {
      margin: 20px auto;
      display: block;
      padding: 10px 20px;
      font-size: 16px;
      background: #007BFF;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="form-section">
    <h1>Formulario de Seguro</h1>
    <label>Tomador:</label><input type="text" id="tomador" oninput="updateField('field-tomador', this.value)">
    <label>Asegurado:</label><input type="text" id="asegurado" oninput="updateField('field-asegurado', this.value)">
    <label>Dirección:</label><input type="text" id="direccion" oninput="updateField('field-direccion', this.value)">
    <label>C.I / RIF:</label><input type="text" id="ci_rif" oninput="updateField('field-ci_rif', this.value)">
    <label>Teléfono:</label><input type="text" id="telefono" oninput="updateField('field-telefono', this.value)">
    <label>Placa:</label><input type="text" id="placa" oninput="updateField('field-placa', this.value)">
    <label>Marca:</label><input type="text" id="marca" oninput="updateField('field-marca', this.value)">
    <label>Modelo:</label><input type="text" id="modelo" oninput="updateField('field-modelo', this.value)">
    <label>Año:</label><input type="number" id="ano" oninput="updateField('field-ano', this.value)">
    <label>Color:</label><input type="text" id="color" oninput="updateField('field-color', this.value)">
  </div>

  <button id="downloadBtn" onclick="downloadPDF()">Descargar PDF del Seguro</button>

  <div id="documento" class="doc-section">
    <div id="field-tomador" class="field" style="top: 70px; left: 120px;"></div>
    <div id="field-asegurado" class="field" style="top: 95px; left: 120px;"></div>
    <div id="field-direccion" class="field" style="top: 120px; left: 120px;"></div>
    <div id="field-ci_rif" class="field" style="top: 145px; left: 120px;"></div>
    <div id="field-telefono" class="field" style="top: 170px; left: 120px;"></div>
    <div id="field-placa" class="field" style="top: 320px; left: 210px;"></div>
    <div id="field-marca" class="field" style="top: 345px; left: 210px;"></div>
    <div id="field-modelo" class="field" style="top: 370px; left: 210px;"></div>
    <div id="field-ano" class="field" style="top: 395px; left: 210px;"></div>
    <div id="field-color" class="field" style="top: 420px; left: 210px;"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
function updateField(id, value) {
  document.getElementById(id).textContent = value;
}

function downloadPDF() {
  const element = document.getElementById('documento');
  html2pdf().set({ filename: 'seguro_generado.pdf' }).from(element).save();
}
</script>
</body>
</html>
