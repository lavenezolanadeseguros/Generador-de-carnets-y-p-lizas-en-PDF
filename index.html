<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Propio Editor de Texto</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f0f0;
    }

    .toolbar {
      padding: 10px;
      background: #333;
      color: white;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .toolbar button, .toolbar select, .toolbar input[type="color"] {
      font-size: 14px;
      padding: 5px;
      cursor: pointer;
    }

    #editor {
      width: 816px; /* Tamaño carta: 8.5 pulgadas * 96px */
      height: 1056px; /* 11 pulgadas * 96px */
      margin: 20px auto;
      background: white;
      padding: 2cm;
      border: 1px solid #ccc;
      overflow-y: auto;
      outline: none;
    }
  </style>
</head>
<body>

<div class="toolbar">
  <button onclick="execCmd('bold')">Negrita</button>
  <button onclick="execCmd('italic')">Cursiva</button>
  <button onclick="execCmd('underline')">Subrayado</button>
  <button onclick="execCmd('insertImage')">Imagen</button>
  <button onclick="insertTable()">Tabla</button>
  <select onchange="execCmd('fontSize', this.value)">
    <option value="3">Tamaño</option>
    <option value="1">Pequeño</option>
    <option value="3" selected>Normal</option>
    <option value="5">Grande</option>
    <option value="7">Muy Grande</option>
  </select>
  <input type="color" onchange="execCmd('foreColor', this.value)" />
  <button onclick="downloadPDF()">Descargar PDF</button>
</div>

<div id="editor" contenteditable="true"></div>

<script>
  const editor = document.getElementById('editor');

  // Cargar del almacenamiento local
  window.onload = () => {
    const saved = localStorage.getItem('mi_documento');
    if (saved) editor.innerHTML = saved;
  }

  // Guardado automático
  editor.addEventListener('input', () => {
    localStorage.setItem('mi_documento', editor.innerHTML);
  });

  function execCmd(command, value = null) {
    if (command === 'insertImage') {
      const url = prompt('URL de la imagen:');
      if (url) document.execCommand('insertImage', false, url);
    } else {
      document.execCommand(command, false, value);
    }
  }

  function insertTable() {
    const rows = prompt('Filas:');
    const cols = prompt('Columnas:');
    if (!rows || !cols) return;

    let html = '<table border="1" style="width:100%; border-collapse: collapse;">';
    for (let i = 0; i < rows; i++) {
      html += '<tr>';
      for (let j = 0; j < cols; j++) {
        html += '<td style="padding:5px;">Celda</td>';
      }
      html += '</tr>';
    }
    html += '</table>';
    document.execCommand('insertHTML', false, html);
  }

  function downloadPDF() {
    const content = editor.innerHTML;
    const win = window.open('', '', 'height=800,width=800');
    win.document.write('<html><head><title>Documento</title></head><body>');
    win.document.write(content);
    win.document.write('</body></html>');
    win.document.close();
    win.focus();
    win.print();
    win.close();
  }
</script>

</body>
</html>
