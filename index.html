<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Venezolana de Seguros</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="logo.png" alt="La Venezolana de Seguros" id="logo">
        <h1>Bienvenido a La Venezolana de Seguros</h1>
    </header>
    <main>
        <section>
            <h2>Generación de Carnet</h2>
            <form id="carnet-form">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
                <label for="cedula">Cédula:</label>
                <input type="text" id="cedula" name="cedula" required>
                <button type="submit">Generar Carnet</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 La Venezolana de Seguros y Vida C.A.</p>
    </footer>
    <script src="app.js"></script>
</body>
</html>
