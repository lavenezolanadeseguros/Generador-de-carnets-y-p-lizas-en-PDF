
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Póliza PDF Editable</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ccc;
            font-family: Arial, sans-serif;
        }
        .page {
            width: 100%;
            max-width: 800px;
            height: auto;
            margin: 20px auto;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: top center;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
            padding-top: 141.4%; /* Proporción A4 (794x1123) */
            position: relative;
        }
        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
        }
        .editable {
            position: absolute;
            color: black;
            font-size: 12px;
            background-color: rgba(255,255,255,0.6);
            padding: 2px 4px;
            border-radius: 3px;
            outline: 1px dashed transparent;
        }
        .editable:focus {
            outline: 1px dashed #000;
            background-color: rgba(255,255,255,0.9);
        }
    </style>
</head>
<body>
  
    <!-- Puedes agregar más campos editables aquí -->
  </div>
</div>
</body></html>
